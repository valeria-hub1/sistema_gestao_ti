<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sistema de Gestão de Equipamentos de TI, controle de inventário, manutenções e suporte técnico.">

    <title>
        {% block title %}
        Gestão de Equipamentos de TI
        {% endblock %}
    </title>

    <!-- FONTE INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- MENU -->
    {% include "menu.html" %}


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- MENSAGENS DO SISTEMA -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <!-- PÁGINAS -->
        {% block content %}

        {% endblock %}

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>
            Sistema de Gestão de Equipamentos de TI
        </p>

        <small>
            Tecnologia, organização e eficiência.
        </small>

    </footer>

</body>

</html>
